name: Prettier code formatter

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check changed files with Prettier
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "$base" "$head" -- '*.md' '*.markdown' '*.html' '*.liquid' '*.js' '*.json' '*.css' '*.scss' '*.yml' '*.yaml')
          else
            mapfile -d '' files < <(git diff-tree --no-commit-id --name-only --diff-filter=ACMR -r -z HEAD -- '*.md' '*.markdown' '*.html' '*.liquid' '*.js' '*.json' '*.css' '*.scss' '*.yml' '*.yaml')
          fi

          if (( ${#files[@]} == 0 )); then
            echo "No supported changed files to check."
            exit 0
          fi

          printf 'Checking %s changed file(s).\n' "${#files[@]}"
          npx prettier --check --ignore-unknown "${files[@]}"
